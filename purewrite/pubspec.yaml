name: purewrite
description: "纯写作 - 现代化跨平台小说创作工具"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 导航
  go_router: ^14.2.7

  # 数据库（关系型，类似 Room）
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4

  # 文件与分享
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2

  # Markdown
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2

  # 工具
  intl: ^0.19.0
  uuid: ^4.5.1

  # 离线语音识别（Vosk）
  vosk_flutter_2: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/models/
